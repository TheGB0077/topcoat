[package]
name = "topcoat-story"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
router = [
	"dep:topcoat-router",
	"dep:topcoat-router-macro",
	"dep:topcoat-view-macro",
	"dep:topcoat-runtime",
	"dep:topcoat-runtime-macro",
	"topcoat-runtime/router",
	"dep:topcoat-asset",
	"topcoat-asset/view",
	"dep:topcoat-asset",
	"topcoat-asset/view",
	"dep:serde",
	"dep:serde_json",
	"dep:serde_urlencoded",
]

[dependencies]
topcoat-asset = { workspace = true, optional = true }
topcoat-core.workspace = true
topcoat-core-macro.workspace = true
topcoat-view.workspace = true
topcoat-router = { workspace = true, optional = true }
topcoat-router-macro = { workspace = true, optional = true }
topcoat-view-macro = { workspace = true, optional = true }
topcoat-runtime = { workspace = true, optional = true }
topcoat-runtime-macro = { workspace = true, optional = true }

inventory.workspace = true
futures-core.workspace = true
percent-encoding.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
serde_urlencoded = { workspace = true, optional = true }

[dev-dependencies]
topcoat = { workspace = true, features = ["story", "view", "router"] }
topcoat-story-macro = { workspace = true, features = ["collect"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
